{{ $random := delimit (seq 9 | shuffle) "" }}
{{ $tpid := md5 $random }}
<div id="a{{ $tpid }}" class="typewriter-content"></div>
<script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
<script type="text/javascript">
    const instance = new Typewriter('#a{{ $tpid }}', {
        strings: '{{ .Inner | replaceRE "\n" "<br>" | safeHTML }}',
        delay: 20,
        autoStart: true,
        loop: false,
    });
</script>
<style>
    .typewriter-content {
        text-align: left;
        padding: 20px 40px;
        margin: 0;
        font-family: monospace;
        line-height: 1.6;
        white-space: pre-wrap;
    }
    
    /* Mobile: respect line breaks */
    @media (max-width: 767px) {
        .typewriter-content {
            max-width: 100%;
        }
    }
    
    /* Desktop: allow text to flow wider */
    @media (min-width: 768px) {
        .typewriter-content {
            max-width: 1400px;
            white-space: normal; /* Let text wrap naturally */
        }
        .typewriter-content br {
            display: none; /* Hide manual line breaks on desktop */
        }
    }
</style>
