{{ $random := delimit (seq 9 | shuffle) "" }}
{{ $tpid := md5 $random }}
<div id="a{{ $tpid }}" style="text-align: left; padding: 20px 40px; max-width: 800px; margin: 0; font-family: monospace; line-height: 1.6; white-space: pre-wrap;"></div>
<script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
<script type="text/javascript">
    const instance = new Typewriter('#a{{ $tpid }}', {
        strings: '{{ .Inner | replaceRE "\n" "<br>" | safeHTML }}',
        delay: 20,
        autoStart: true,
        loop: false,
    });
</script>
