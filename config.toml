baseURL = "https://tylenol-murders.netlify.app"
title = "Tylenol Murders Case Files"
theme = "hugo-theme-shell"
languageCode = "en-us"

[Params]

[Params.Terminal]
scheme = "Molokai"
userName = "detective"
pcName = "cpd"
workDir = "casefiles"
profile = "brief.txt"
ps1Delay = 0
stdoutDelay = 0
commandDelay = 50
titleDelay = 0
contentDelay = 0
description = """
CASE FILE SYSTEM v0.0.1

The
Unsolved 
Tylenol Murder Case

Welcome, Detective.

Tylenol Murders - 1982
7 victims. Unsolved.

Navigate case files below.
"""

[Params.Tree]
use = true
folderName = "files"
files = [ 
  ["Start Here: Case Briefing", "/tylenol-case/"],
  ["Victim Board", "/tylenol-case/board/"],
  ["Crime Scene Briefing", "/tylenol-case/briefing/"],
  ["Community & Locations", "/tylenol-case/community/"],
  ["Physical Toolkit", "/tylenol-case/toolkit/"],
  ["Evidence", "/tylenol-case/evidence/"],
  ["Suspect Intake", "/tylenol-case/intake/"],
  ["Case Tasks", "/tylenol-case/tasks/"],
  ["Case Support", "/tylenol-case/support/"],
  ["Media Logs", "/tylenol-case/media/"],
  ["Timeline", "/tylenol-case/timeline/"],
]