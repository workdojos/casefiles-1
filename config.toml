baseURL = "https://tylenol-murders.netlify.app"
title = "Tylenol Murders Case Files"
theme = "hugo-theme-shell"
languageCode = "en-us"

[Params]

[Params.Terminal]
scheme = "Molokai"
userName = "detective"
pcName = "cpd"
workDir = "casefiles"
profile = "brief.txt"
ps1Delay = 0
stdoutDelay = 0
commandDelay = 50
titleDelay = 0
contentDelay = 0
description = """
CASE FILE SYSTEM v0.0.1

The
Unsolved 
Tylenol Murder Case

Welcome, Detective.

Tylenol Murders - 1982
7 victims. Unsolved.

Navigate case files below.
"""

[Params.Tree]
use = true
folderName = "files"
files = [ 
  ["Start Here: Case Briefing", "/tylenol-case/"],
  ["Victims (7 total)", "/tylenol-case/victims/"],
  ["Suspects", "/tylenol-case/suspects/"],
  ["Locations", "/tylenol-case/locations/"],
  ["Timeline", "/tylenol-case/timeline/"],
  ["Evidence", "/tylenol-case/evidence/"],
  ["Documents", "/tylenol-case/documents/"],
]