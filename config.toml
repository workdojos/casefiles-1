baseURL = "https://tylenol-murders.netlify.app"
title = "Tylenol Murders Case Files"
theme = "hugo-theme-shell"
languageCode = "en-us"

[Params]

[Params.Terminal]
scheme = "Molokai"
userName = "detective"
pcName = "cpd"
workDir = "casefiles"
profile = "brief.txt"
ps1Delay = 0
stdoutDelay = 0
commandDelay = 50
titleDelay = 0
contentDelay = 0
description = """
CASE FILE SYSTEM v0.0.1

The
Unsolved 
Tylenol Murder Case

Welcome, Detective.

Tylenol Murders - 1982
7 victims. Unsolved.

Navigate case files below.
"""

[Params.Tree]
use = true
folderName = "files"
files = [ 
  ["Start Here: Case Briefing", "/tylenol-case/"],
  ["Board", "/tylenol-case/board/"],
  ["Agent", "/tylenol-case/agent/"],
  ["Media Logs", "/tylenol-case/media/"],
  ["Briefing", "/tylenol-case/briefing/"],
  ["Community", "/tylenol-case/community/"],
  ["Intake", "/tylenol-case/intake/"],
  ["Support", "/tylenol-case/support/"],
  ["asks", "/tylenol-case/tasks/"],
  ["Toolkit", "/tylenol-case/toolkit/"],
  ["Evidence", "/tylenol-case/evidence/"],
  ["Locations", "/tylenol-case/locations/"],
  ["Suspects", "/tylenol-case/suspects/"],
  ["Timeline", "/tylenol-case/sequence/"],
  ["Victims", "/tylenol-case/victims/"],
]